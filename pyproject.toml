[project]
name = "ask-census"
version = "0.1.0"
description = "Agentic wrapper for CELLxGENE census query generation with ontology-aware term expansion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cxg-query-enhancer>=0.2.3",
    "cellxgene-census>=1.0.0",
    # author-annotations skill: remote h5ad obs probe + augment
    "fsspec>=2024.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["gene_resolver"]
packages = ["author_annotations"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires network access; run with -m integration",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=7.0",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
