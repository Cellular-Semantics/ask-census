[project]
name = "ask-census"
version = "0.1.0"
description = "Agentic wrapper for CELLxGENE census query generation with ontology-aware term expansion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cxg-query-enhancer>=0.2.3",
    "cellxgene-census>=1.0.0",
    "anndata>=0.10.0",
    "pyroaring>=1.0.3",
    "pandas>=2.0.0",
    "certifi>=2026.1.4",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["gene_resolver", "bitmap_manifest_join_lib", "enrich_slice_runner"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
